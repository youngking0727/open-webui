use_default_settings: true

general:
  instance_name: "OpenBioMed Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "openbiomed-searxng-secret-key-change-this"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false

outgoing:
  request_timeout: 15.0
  max_request_timeout: 20.0

engines:
  - name: bing
    engine: bing
    shortcut: bi
    categories:
      - general
      - web
    disabled: false
    base_url: https://cn.bing.com
